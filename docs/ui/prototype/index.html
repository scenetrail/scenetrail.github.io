<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SceneTrail 試作品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* 方向：映画の場面を選ぶ「フィルムの目次」。写真が主役、文字は明朝で大きく、地図は脇役 */
:root {
  --bg: #f4f2ed;
  --paper: #ffffff;
  --ink: #161b2e;
  --ink-soft: #5b6072;
  --line: #e0ddd5;
  --night: #0e1430;      /* 夜空 */
  --dusk: #f0a35e;       /* 夕焼け */
  --cord: #c8452c;       /* 組紐 */
  --c-off: #1f6f5c; --c-press: #2f5d9e; --c-fan: #9a6a12;
  --warn-bg: #fff6e3; --warn-line: #e3b04f;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-num: "Inter", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.8 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
img { max-width: 100%; display: block; }
button { font: inherit; cursor: pointer; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--dusk); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* 試作品の帯 */
.proto { background: #000; color: #ddd; font-size: 11px; }
.proto .wrap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 3px; padding-bottom: 3px; }

/* 上部 */
.top-bar { position: sticky; top: 0; z-index: 50; background: rgba(14,20,48,.94); backdrop-filter: blur(8px); color: #fff; }
.top-bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 54px; gap: 12px; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-decoration: none; letter-spacing: .03em; }
.logo i { font-style: normal; color: var(--dusk); }
.top-bar nav { display: flex; gap: 4px; align-items: center; }
.top-bar nav a { font-size: 13px; text-decoration: none; padding: 4px 10px; border-radius: 999px; opacity: .9; white-space: nowrap; }
.top-bar nav a.on { background: rgba(255,255,255,.16); opacity: 1; }
.lang { border: 1px solid rgba(255,255,255,.5); }
@media (max-width: 400px) { .top-bar .wrap { gap: 6px; } .top-bar nav { gap: 0; } .top-bar nav a { padding: 4px 7px; font-size: 12.5px; } .logo { font-size: 18px; } }
.unofficial { font-size: 11px; color: rgba(255,255,255,.7); text-align: center; padding: 0 8px 4px; }

/* 作品の扉（トップ） */
.hero { position: relative; color: #fff; background: var(--night); min-height: 480px; display: flex; align-items: flex-end; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .7; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,20,48,.1) 0%, rgba(14,20,48,.35) 45%, rgba(14,20,48,.96) 100%); }
.hero .wrap { position: relative; z-index: 1; padding-top: 80px; padding-bottom: 36px; width: 100%; }
.eyebrow { font-family: var(--f-num); font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--dusk); font-weight: 700; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(38px, 9vw, 68px); line-height: 1.2; margin: 6px 0 10px; text-wrap: balance; }
.hero p { max-width: 34em; color: rgba(255,255,255,.9); margin: 0 0 18px; }
.hero .stats { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,.85); }
.hero .stats b { font-family: var(--f-num); font-size: 26px; color: #fff; display: block; line-height: 1.1; }
.credit { position: absolute; right: 8px; bottom: 4px; z-index: 1; font-size: 10px; color: rgba(255,255,255,.6); }

/* 章のタブ */
.chapters { position: sticky; top: 74px; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); }
.chapters .wrap { display: flex; gap: 6px; overflow-x: auto; padding-top: 10px; padding-bottom: 10px; scrollbar-width: none; }
.chapters button { flex: none; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chapters button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chapters button[aria-pressed="true"]::before { content: "✓ "; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0 6px; }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; min-width: 0; }
.search input { border: none; outline: none; font: inherit; width: 100%; min-width: 0; background: transparent; color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; text-decoration: none; background: var(--paper); white-space: nowrap; }
.manner-note { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.manner-note a { color: var(--cord); font-weight: 700; }

/* 章の見出しと場面カード */
.chapter-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 40px 0 14px; }
.chapter-h .no { font-family: var(--f-num); font-weight: 700; color: var(--cord); letter-spacing: .15em; font-size: 12px; }
.chapter-h h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; margin: 0; }
.chapter-h span.d { color: var(--ink-soft); font-size: 13px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
.card { position: relative; display: flex; flex-direction: column; background: var(--paper); border-radius: var(--radius); overflow: hidden; text-decoration: none; box-shadow: 0 1px 2px rgba(22,27,46,.06), 0 6px 20px rgba(22,27,46,.06); transition: transform .2s, box-shadow .2s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(22,27,46,.08), 0 14px 32px rgba(22,27,46,.12); }
.card .ph { position: relative; aspect-ratio: 4 / 3; background: var(--night); overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; }
.card .ph .scn { position: absolute; left: 12px; top: 10px; font-family: var(--f-num); font-weight: 700; font-size: 12px; letter-spacing: .12em; color: #fff; background: rgba(14,20,48,.72); padding: 2px 8px; border-radius: 4px; }
.card .ph .noimg { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 24px; color: #fff; background: radial-gradient(120% 90% at 85% 5%, #46508f 0%, var(--night) 62%); }
.card .ph .noimg .big { font-family: var(--f-num); font-weight: 700; font-size: 96px; line-height: 1; color: rgba(255,255,255,.14); letter-spacing: -.02em; }
.card .ph .noimg small { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,.6); }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .title { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.45; }
.card .where { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.card .where::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--cord); flex: none; }
.card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 6px; }
.go { font-size: 13px; font-weight: 700; color: var(--cord); white-space: nowrap; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 0 7px; border: 1.5px solid currentColor; white-space: nowrap; line-height: 1.7; background: var(--paper); }
.badge.official { color: var(--c-off); } .badge.official::before { content: "◆"; }
.badge.press { color: var(--c-press); } .badge.press::before { content: "●"; }
.badge.fan { color: var(--c-fan); border-style: dashed; } .badge.fan::before { content: "▲"; }
.empty { text-align: center; padding: 40px 16px; color: var(--ink-soft); }

/* 場面ページ */
.scene-head { background: var(--night); color: #fff; padding: 22px 0 26px; }
.crumb { font-size: 12px; color: rgba(255,255,255,.7); }
.crumb a { color: rgba(255,255,255,.88); }
.scene-head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 6vw, 44px); line-height: 1.3; margin: 8px 0 8px; text-wrap: balance; }
.scene-head .sub { color: rgba(255,255,255,.85); font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.compare { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 22px; }
@media (min-width: 760px) { .compare { grid-template-columns: 1fr 1fr; } }
.frame { margin: 0; min-width: 0; }
.frame .lbl { font-family: var(--f-num); font-size: 11px; font-weight: 700; letter-spacing: .15em; color: var(--ink-soft); margin-bottom: 6px; }
.frame .box { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; position: relative; background: #dcdbe3; }
.frame .box img { width: 100%; height: 100%; object-fit: cover; }
.frame .none { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 13px; }
.story { border-radius: 10px; background: linear-gradient(160deg, #1c2550, var(--night)); color: #fff; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.story p { margin: 0; font-family: var(--f-display); font-size: 17px; line-height: 1.9; }
.story .vid { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.story button { background: #fff; color: var(--ink); border: none; border-radius: 999px; padding: 10px 18px; font-weight: 700; min-height: 44px; }
.story small { font-size: 12px; opacity: .85; }
.story a { color: #fff; }
.qbox { position: relative; aspect-ratio: 16 / 9; border: 2px solid rgba(255,255,255,.55); border-radius: 6px; background: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 12px, rgba(255,255,255,.12) 12px 24px); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; padding: 12px 18px; color: rgba(255,255,255,.85); }
.qbox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.qbox:has(img) { padding: 0; border-color: #fff; }
.qbox .tag { z-index: 1;  position: absolute; left: 8px; top: 8px; background: #fff; color: var(--ink); font-size: 11px; font-weight: 700; padding: 0 8px; border-radius: 3px; }
.qcap { font-size: 12px; opacity: .85; margin-top: -8px; }
.player { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 8px; background: #000; }
.compare .frame { display: flex; flex-direction: column; }
.compare .frame > .story { flex: 1; }
figcaption { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
.embed { aspect-ratio: 16 / 9; border-radius: 10px; background: linear-gradient(160deg, #1c2550, var(--night)); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 14px; }
.embed button { background: #fff; color: var(--ink); border: none; border-radius: 999px; padding: 10px 18px; font-weight: 700; }
.embed small { font-size: 12px; opacity: .85; }
.prose { max-width: 40em; font-size: 16px; }
.layout { display: grid; grid-template-columns: 1fr; gap: 28px; margin-top: 28px; }
@media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) 380px; } }
.place-card { order: -1; }
@media (min-width: 900px) { .place-card { order: 0; } }
.place-card .cautions { padding: 10px 14px; font-size: 13.5px; }
.place-card .cautions h2 { font-size: 16px; }
.place-card { background: var(--paper); border-radius: var(--radius); overflow: hidden; box-shadow: 0 6px 20px rgba(22,27,46,.07); align-self: start; }
@media (min-width: 900px) { .place-card { position: sticky; top: 90px; } }
.place-card .mini { height: 220px; background: #e6e8ee; }
.place-card .in { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.place-card h3 { font-family: var(--f-display); font-size: 21px; margin: 0; line-height: 1.4; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; }
.btn { display: flex; justify-content: center; align-items: center; gap: 6px; border-radius: 10px; padding: 11px 14px; font-weight: 700; text-decoration: none; min-height: 46px; border: 2px solid var(--ink); background: var(--paper); }
.btn.primary { background: var(--cord); border-color: var(--cord); color: #fff; }
.cautions { background: var(--warn-bg); border: 1.5px solid var(--warn-line); border-radius: 12px; padding: 14px 18px; }
.cautions h2 { font-family: var(--f-display); font-size: 20px; margin: 0 0 6px; }
.cautions ul { margin: 0; padding-left: 1.2em; }
.sec-h { font-family: var(--f-display); font-size: 22px; font-weight: 800; margin: 30px 0 10px; }
.src { font-size: 13.5px; padding-left: 1.2em; }
.next { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 40px 0 10px; }
@media (min-width: 640px) { .next { grid-template-columns: 1fr 1fr; } }
.next a { display: block; background: var(--paper); border-radius: 12px; padding: 14px 16px; text-decoration: none; border: 1px solid var(--line); }
.next a small { display: block; font-family: var(--f-num); font-size: 11px; letter-spacing: .12em; color: var(--ink-soft); }
.next a b { font-family: var(--f-display); font-size: 17px; }
.next a.n { text-align: right; }
.small { font-size: 13px; color: var(--ink-soft); }

/* 地図ページ */
#bigmap { height: calc(100vh - 230px); min-height: 420px; border-radius: var(--radius); margin-top: 12px; }
.pin { width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--night); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
.pin span { transform: rotate(45deg); color: #fff; font: 700 11px var(--f-num); }
.pin.here { background: var(--cord); }
.leaflet-popup-content { font-family: var(--f-body); margin: 10px 12px; }
.pop b { display: block; font-family: var(--f-display); font-size: 15px; line-height: 1.4; }
.pop a { color: var(--cord); font-weight: 700; }

/* 文章のページ */
.text-page { max-width: 720px; padding-top: 28px; padding-bottom: 40px; }
.text-page h1 { font-family: var(--f-display); font-size: 32px; }
.text-page h2 { font-family: var(--f-display); font-size: 20px; margin-top: 26px; }

footer { margin-top: 56px; background: var(--night); color: rgba(255,255,255,.75); font-size: 12.5px; padding: 26px 0 34px; }
footer nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0; }
footer a { color: #fff; }
footer .credits { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,.55); }
</style>
</head>

  <div class="wrap">

<footer><div class="wrap" id="footer"></div></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  official: { ja: "公式の案内あり", en: "Official guide", long: { ja: "作品の公式・自治体・観光協会が舞台として案内しています。", en: "Listed as a setting by the official site, local government or tourism association." } },
  press: { ja: "報道で紹介", en: "Reported in the press", long: { ja: "新聞・テレビ・出版社の記事で舞台として紹介されています。公式の案内はありません。", en: "Introduced as a setting by news articles. No official guide." } },
  fan: { ja: "ファンの調べ", en: "Found by fans", long: { ja: "ファンの調べで特定された場所です（別々の2人以上）。公式の確認はありません。", en: "Identified by fans (two or more independent sources). Not officially confirmed." } },
};

let lang = "ja";
let chapter = "all";
let query = "";
let lmap = null;
const t = (k) => T[lang][k];
const L_ = (o) => (o && typeof o === "object" && !Array.isArray(o) ? o[lang] : o);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const placeOf = (s) => PLACES.find((p) => p.id === s.place);
const badge = (c) => `<span class="badge ${c}">${CERT[c][lang]}</span>`;
const sid = (n) => String(n).padStart(2, "0");

function route() {
  const raw = location.hash.replace(/^#/, "");
  const [page, q] = raw.split("?");
  return { page: page || "top", params: new URLSearchParams(q || "") };
}
function link(h) { return h + (lang === "en" ? (h.includes("?") ? "&" : "?") + "lang=en" : ""); }

function render() {
  const { page, params } = route();
  lang = params.get("lang") === "en" ? "en" : "ja";
  chapter = params.get("ch") || "all";
  document.documentElement.lang = lang;
  document.getElementById("protoNote").textContent = t("proto");
  document.getElementById("protoNote2").textContent = t("proto2");
  document.getElementById("unofficial").textContent = t("unofficial");
  document.getElementById("logo").href = link("#top");
  const p2 = new URLSearchParams(params); p2.set("lang", lang === "ja" ? "en" : "ja");
  document.getElementById("nav").innerHTML = `
    <a href="${link("#top")}" class="${page === "top" || page.startsWith("scene-") ? "on" : ""}">${t("scenes")}</a>
    <a href="${link("#map")}" class="${page === "map" ? "on" : ""}">${t("map")}</a>
    <a href="${link("#manners")}" class="${page === "manners" ? "on" : ""}">${t("manners")}</a>
    <a class="lang" href="#${page}?${p2}">${t("langTo")}</a>`;
  renderFooter();
  if (lmap) { lmap.remove(); lmap = null; }
  const app = document.getElementById("app");
  if (page.startsWith("scene-")) {
    const s = SCENES.find((x) => x.id === page.slice(6));
    if (s) { app.innerHTML = scenePage(s); afterScene(s); } else { app.innerHTML = topPage(); afterTop(); }
  } else if (page === "map") { app.innerHTML = mapPage(); afterMap(); }
  else if (page === "manners") app.innerHTML = mannersPage();
  else if (page === "contact") app.innerHTML = contactPage();
  else { app.innerHTML = topPage(); afterTop(); }
  window.scrollTo(0, 0);
}
function renderFooter() {
  const keys = [...new Set([HERO_PHOTO, ...SCENES.map((s) => s.photo)].filter(Boolean))];
  const used = keys.map((k) => PHOTOS[k]).filter(Boolean);
  document.getElementById("footer").innerHTML = `<div>${t("footer1")}</div>
    <nav><a href="${link("#manners")}">${t("manners")}</a><a href="${link("#contact")}">${t("contact")}</a><a href="#top" onclick="return false">${t("about2")}</a></nav>
    <div>${t("mapAttr")}</div>
    <div class="credits">${t("photoBy")}: ${used.map((p) => `${esc(p.title)} — ${esc(p.creator || p.source)} (${esc(p.license)}, <a href="${esc(p.page)}" target="_blank" rel="noopener noreferrer">${esc(p.source)}</a>)`).join(" ／ ")}</div>`;
}

/* ===== トップ＝作品の扉と場面の目次 ===== */
function matches(s) {
  if (chapter !== "all" && s.chapter !== chapter) return false;
  if (!query) return true;
  const p = placeOf(s);
  const hay = [s.title.ja, s.title.en, p.name.ja, p.name.en, p.area.ja, p.area.en, s.keywords || ""].join(" ").toLowerCase();
  return query.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}
function card(s) {
  const p = placeOf(s);
  const ph = s.photo && PHOTOS[s.photo]
    ? `<img src="${PHOTOS[s.photo].file}" alt="${esc(L_(p.name))}" loading="lazy">`
    : `<div class="noimg"><span class="big">${sid(s.no)}</span><small>${esc(L_(placeOf(s).area))} ／ ${t("noPhoto")}</small></div>`;
  return `<a class="card" href="${link("#scene-" + s.id)}">
    <div class="ph">${ph}<span class="scn">${t("scene")} ${sid(s.no)}</span></div>
    <div class="body">
      <div class="title">${esc(L_(s.title))}</div>
      <div class="where">${esc(L_(p.name))}・${esc(L_(p.area))}</div>
      <div class="foot"><span class="go">${t("see")}</span></div>
    </div></a>`;
}
function topPage() {
  const hero = PHOTOS[HERO_PHOTO];
  const areas = new Set(PLACES.map((p) => p.area.ja)).size;
  return `<section class="hero">
    ${hero ? `<img src="${hero.file}" alt="">` : ""}
    <div class="wrap">
      <div class="eyebrow">${t("eyebrow")}</div>
      <h1>${t("title")}</h1>
      <p>${t("heroLead")}</p>
      <div class="stats"><span><b>${SCENES.length}</b>${t("nScenes")}</span><span><b>${PLACES.length}</b>${t("nPlaces")}</span><span><b>${areas}</b>${t("nAreas")}</span></div>
    </div>
    ${hero ? `<span class="credit">${t("photoBy")}: ${esc(hero.creator || hero.source)} (${esc(hero.license)})</span>` : ""}
  </section>
  <div class="chapters"><div class="wrap" id="chTabs" role="group">
    ${[{ id: "all", ja: t("all"), en: t("all") }, ...CHAPTERS].map((c) => `<button type="button" data-ch="${c.id}" aria-pressed="${chapter === c.id}">${esc(L_(c))}</button>`).join("")}
  </div></div>
  <div class="wrap">
    <div class="tools">
      <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="${t("search")}" value="${esc(query)}" aria-label="${t("search")}"></label>
      <a class="pill" href="${link("#map")}">🗺 ${t("showMap")}</a>
    </div>
    <p class="manner-note">${t("beforeVisit")} <a href="${link("#manners")}">${t("mannerLink")}</a>${t("mannerTail")}</p>
    <div id="list"></div>
  </div>`;
}
function listHtml() {
  let h = "", total = 0;
  CHAPTERS.forEach((c, i) => {
    const ss = SCENES.filter((s) => s.chapter === c.id && matches(s));
    if (!ss.length) return;
    total += ss.length;
    h += `<div class="chapter-h"><span class="no">${t("chapter")} ${i + 1}</span><h2>${esc(L_(c))}</h2><span class="d">${esc(L_(c.desc))}</span></div>
      <div class="grid">${ss.map(card).join("")}</div>`;
  });
  return total ? h : `<div class="empty">${t("noMatch")}</div>`;
}
function afterTop() {
  const list = document.getElementById("list");
  list.innerHTML = listHtml();
  document.getElementById("chTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ch]"); if (!b) return;
    chapter = b.dataset.ch;
    history.replaceState(null, "", link(chapter === "all" ? "#top" : "#top?ch=" + chapter));
    document.querySelectorAll("#chTabs button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.ch === chapter));
    list.innerHTML = listHtml();
  });
  document.getElementById("q").addEventListener("input", (e) => { query = e.target.value.trim(); list.innerHTML = listHtml(); });
}

/* ===== 場面ページ ===== */
function scenePage(s) {
  const p = placeOf(s);
  const i = SCENES.indexOf(s);
  const prev = SCENES[i - 1], next = SCENES[i + 1];
  const ch = CHAPTERS.find((c) => c.id === s.chapter);
  const ph = s.photo && PHOTOS[s.photo];
  const v = s.video;
  const vt = v && v.start != null ? `${Math.floor(v.start / 60)}:${String(v.start % 60).padStart(2, "0")}` : null;
  const ytUrl = v ? `https://www.youtube.com/watch?v=${v.id}${v.start ? "&t=" + v.start + "s" : ""}` : "";
  const sceneFrame = `<figure class="frame"><div class="lbl">${t("theScene")}</div><div class="story" id="storyBox">
      <p>${esc(L_(s.desc))}</p>
      <div class="qbox">${s.quote ? `<img src="${s.quote}" alt="" onerror="this.remove()">` : ""}<span class="tag">${t("quote")}</span>${t("quotePh")}</div>
      <div class="qcap">${t("copyright")}</div>
      ${v ? `<div class="vid" id="vid"><button type="button" id="playBtn">${vt ? t("playFrom").replace("{t}", vt) : t("play")}</button>
        <small>${t("embedNote").replace("{c}", esc(L_(v.channel)))}・<a href="${ytUrl}" target="_blank" rel="noopener noreferrer">${t("openYt")} ↗</a></small></div>` : ""}
    </div></figure>`;
  const todayFrame = `<figure class="frame"><div class="lbl">${t("today")}</div><div class="box">${ph ? `<img src="${ph.file}" alt="${esc(L_(p.name))}">` : `<div class="none">${t("noToday")}</div>`}</div>
    ${ph ? `<figcaption>${t("photoBy")}: ${esc(ph.creator || ph.source)}（${esc(ph.license)}・<a href="${esc(ph.page)}" target="_blank" rel="noopener noreferrer">${esc(ph.source)} ↗</a>）</figcaption>` : ""}</figure>`;
  const same = SCENES.filter((x) => x.place === s.place && x !== s);
  return `<section class="scene-head"><div class="wrap">
      <div class="crumb"><a href="${link("#top")}">${t("title")}</a> › <a href="${link("#top?ch=" + s.chapter)}">${esc(L_(ch))}</a></div>
      <div class="eyebrow" style="margin-top:10px">${t("scene")} ${sid(s.no)} ／ ${esc(L_(ch))}</div>
      <h1>${esc(L_(s.title))}</h1>
      <div class="sub"><span>📍 ${esc(L_(p.name))}・${esc(L_(p.area))}</span></div>
    </div></section>
  <div class="wrap">
    <div class="compare">${sceneFrame}${todayFrame}</div>
    <div class="layout">
      <div>
        ${same.length ? `<h2 class="sec-h">${t("sameplace")}</h2><div class="grid">${same.map(card).join("")}</div>` : ""}
        <nav class="next">
          ${prev ? `<a href="${link("#scene-" + prev.id)}"><small>← ${t("prev")} ／ ${t("scene")} ${sid(prev.no)}</small><b>${esc(L_(prev.title))}</b></a>` : "<span></span>"}
          ${next ? `<a class="n" href="${link("#scene-" + next.id)}"><small>${t("next")} ／ ${t("scene")} ${sid(next.no)} →</small><b>${esc(L_(next.title))}</b></a>` : "<span></span>"}
        </nav>
        <p class="small"><a href="${link("#top")}">← ${t("allScenes")}</a>　<a href="${link("#contact")}">${t("report")}</a></p>
      </div>
      <aside class="place-card">
        <div class="mini" id="mini"></div>
        <div class="in">
          <div class="small">${t("place")}</div>
          <h3>${esc(L_(p.name))}</h3>
          <dl class="kv"><dt>${t("address")}</dt><dd>${esc(L_(p.address))}</dd><dt>${t("stand")}</dt><dd>${esc(L_(p.stand))}</dd></dl>
          <section class="cautions"><h2>${t("cautions")}</h2><ul>${L_(p.cautions).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>
          <a class="btn primary" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}">${t("route")} ↗</a>
          <a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lng}">${t("sv")} ↗</a>
        </div>
      </aside>
    </div>
  </div>`;
}
function baseLayer() {
  const layer = L.maplibreGL({ style: "https://tiles.openfreemap.org/styles/liberty", attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener noreferrer">OpenFreeMap</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>' });
  layer.on("add", () => {
    const ml = layer.getMaplibreMap();
    ml.on("styledata", () => {
      for (const ly of ml.getStyle().layers) {
        if (ly.type === "symbol" && ml.getLayoutProperty(ly.id, "text-field")) {
          try { ml.setLayoutProperty(ly.id, "text-field", ["coalesce", ["get", "name:" + lang], ["get", "name"]]); } catch { /* 文字の無い層 */ }
        }
      }
    });
  });
  return layer;
}
function pinIcon(label, here) {
  return L.divIcon({ className: "", html: `<div class="pin${here ? " here" : ""}"><span>${label}</span></div>`, iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -30] });
}
function afterScene(s) {
  const b = document.getElementById("playBtn");
  if (b) b.addEventListener("click", () => {
    const v = s.video;
    const f = document.createElement("iframe");
    f.className = "player";
    f.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0${v.start ? "&start=" + v.start : ""}`;
    f.title = L_(v.channel);
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.referrerPolicy = "strict-origin-when-cross-origin";
    document.getElementById("playBtn").replaceWith(f);
  });
  if (typeof L === "undefined") return;
  const p = placeOf(s);
  lmap = L.map("mini", { zoomControl: false, scrollWheelZoom: false }).setView([p.lat, p.lng], 16);
  baseLayer().addTo(lmap);
  L.marker([p.lat, p.lng], { icon: pinIcon(sid(s.no), true), title: L_(p.name) }).addTo(lmap);
  const m = lmap;
  requestAnimationFrame(() => setTimeout(() => { if (lmap === m) { m.invalidateSize(); m.setView([p.lat, p.lng], 16); } }, 50));
}

/* ===== 地図ページ ===== */
function mapPage() {
  return `<div class="wrap"><h1 class="sec-h" style="font-size:28px;margin-top:24px">${t("mapTitle")}</h1><p class="small">${t("mapLead")}</p><div id="bigmap"></div></div>`;
}
function afterMap() {
  if (typeof L === "undefined") return;
  lmap = L.map("bigmap");
  baseLayer().addTo(lmap);
  const pts = [];
  for (const p of PLACES) {
    const ss = SCENES.filter((s) => s.place === p.id);
    if (!ss.length) continue;
    pts.push([p.lat, p.lng]);
    L.marker([p.lat, p.lng], { icon: pinIcon(sid(ss[0].no), false), title: L_(p.name) })
      .bindPopup(`<div class="pop">${ss.map((s) => `<b>${t("scene")} ${sid(s.no)}：${esc(L_(s.title))}</b><a href="${link("#scene-" + s.id)}">${t("see")}</a>`).join("<br>")}<div class="small">${esc(L_(p.name))}</div></div>`)
      .addTo(lmap);
  }
  lmap.fitBounds(pts, { padding: [40, 40] });
}

/* ===== 文章のページ ===== */
function mannersPage() {
  return `<div class="wrap text-page">${lang === "ja" ? `<h1>巡礼のマナー</h1><p>舞台の多くは、人が暮らし、働いている場所です。</p>
  <h2>住宅地で</h2><ul><li>私道・敷地・駐車場に入らない</li><li>住民や家・車のナンバーを撮らない</li><li>階段・歩道・道をふさいで撮らない。長く居座らない</li><li>早朝・夜は声を小さく</li></ul>
  <h2>神社・お寺で</h2><ul><li>撮影が禁じられた所では撮らない</li><li>参拝の人を優先する</li></ul>
  <h2>駅・道路で</h2><ul><li>線路や車道に出て撮らない</li></ul>
  <h2>図書館・お店で</h2><ul><li>撮影は職員・店の人に聞いてから</li></ul>
  <h2>ごみ</h2><ul><li>ごみは持ち帰る（日本は街なかのごみ箱が少ない）</li></ul>` : `<h1>Pilgrimage etiquette</h1><p>Most settings are places where people live and work.</p>
  <h2>In residential areas</h2><ul><li>Do not enter private roads, yards or parking lots</li><li>Do not photograph residents, houses or license plates</li><li>Do not block stairs, sidewalks or roads. Do not linger</li><li>Keep your voice down early in the morning and at night</li></ul>
  <h2>At shrines and temples</h2><ul><li>Do not take photos where it is prohibited</li><li>Give way to worshippers</li></ul>
  <h2>At stations and on roads</h2><ul><li>Never step onto tracks or into traffic for a photo</li></ul>
  <h2>In libraries and shops</h2><ul><li>Ask the staff before taking photos</li></ul>
  <h2>Trash</h2><ul><li>Take your trash with you (public bins are rare in Japan)</li></ul>`}</div>`;
}
function contactPage() {
  return `<div class="wrap text-page">${lang === "ja" ? `<h1>連絡・削除の求め</h1><p>画像や場所の掲載をやめてほしいときは、ページの URL と「どれを」を書いてお送りください。<b>理由をうかがう前に、72 時間以内に公開から外します。</b></p><p class="small">連絡先：（専用のメールアドレス・フォーム。オーナーが決める）</p>` : `<h1>Contact / removal requests</h1><p>Send us the page URL and what to remove. <b>We take it down within 72 hours, before asking for reasons.</b></p><p class="small">Contact: (dedicated email or form, to be decided)</p>`}</div>`;
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
